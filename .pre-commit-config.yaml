repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd backend && uv run ruff check .'
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format --check
        entry: bash -c 'cd backend && uv run ruff format --check .'
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && uv run mypy app'
        language: system
        types: [python]
        pass_filenames: false

      # Активируется автоматически, когда Contracts-агент добавит scripts/check_openapi.py.
      - id: openapi-drift
        name: OpenAPI contract drift
        entry: "bash -c 'if [ -f scripts/check_openapi.py ]; then cd backend && uv run python ../scripts/check_openapi.py; else echo \"openapi-drift skipped (scripts/check_openapi.py missing)\"; fi'"
        language: system
        files: ^backend/app/(schemas|api)/
        pass_filenames: false
