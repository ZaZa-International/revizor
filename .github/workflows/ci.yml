name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: mgts
          POSTGRES_PASSWORD: mgts
          POSTGRES_DB: mgts_infra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mgts -d mgts_infra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      s3:
        image: localstack/localstack:4.3.0
        env:
          SERVICES: s3
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      DATABASE_URL: postgresql+asyncpg://mgts:mgts@localhost:5432/mgts_infra
      # db 15 — изолированная логическая БД для тестов (conftest делает FLUSHDB);
      # совпадает с scripts/test.sh и scripts/ci_local.sh.
      REDIS_URL: redis://localhost:6379/15
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /tmp/mgts-storage
      S3_ENDPOINT_URL: http://localhost:4566
      APP_ENV: test
      ML_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Unit tests
        run: uv run pytest -m unit

      - name: Integration / API / contract tests
        run: >-
          uv run pytest -m "integration or api or contract"
          --cov=app --cov-report=term-missing --cov-report=xml

      - name: Migration roundtrip (downgrade base + upgrade head)
        run: uv run alembic downgrade base && uv run alembic upgrade head

      - name: OpenAPI drift (committed schema vs app)
        run: uv run python ../scripts/check_openapi.py

      - name: TypeScript client drift
        working-directory: ${{ github.workspace }}
        run: |
          npx --yes openapi-typescript contracts/openapi/openapi.json -o /tmp/schema.d.ts
          diff -u contracts/typescript/schema.d.ts /tmp/schema.d.ts

      - name: OpenAPI breaking changes (vs origin/main)
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin main
          if git show origin/main:contracts/openapi/openapi.json > /tmp/base.json 2>/dev/null; then
            docker run --rm \
              -v /tmp:/tmp \
              -v "${{ github.workspace }}/contracts/openapi:/spec" \
              tufin/oasdiff:latest breaking /tmp/base.json /spec/openapi.json
          else
            echo "No baseline contracts/openapi/openapi.json on origin/main — skipping breaking-change check"
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t mgts-infra-backend:ci backend/

  smoke:
    runs-on: ubuntu-latest
    needs: [tests, docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Start full stack (base + dev override)
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

      - name: Wait for healthy stack (<=180s)
        run: |
          compose() { docker compose -f docker-compose.yml -f docker-compose.dev.yml "$@"; }
          deadline=$((SECONDS + 180))
          for svc in db redis s3 backend worker; do
            while true; do
              id="$(compose ps -q "$svc")"
              status="$(docker inspect -f '{{.State.Health.Status}}' "$id" 2>/dev/null || echo starting)"
              if [ "$status" = "healthy" ]; then
                echo "$svc: healthy"
                break
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "ERROR: $svc not healthy within 180s" >&2
                compose ps
                compose logs --tail=100
                exit 1
              fi
              sleep 3
            done
          done

      # BOOTSTRAP_ADMIN_PASSWORD пуст в .env.example → admin не создаётся;
      # smoke работает под demo-operator, которого создаёт seed.
      - name: Seed demo data (creates demo-operator)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://mgts:mgts@localhost:5432/mgts_infra
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT_URL: http://localhost:9000
        run: uv run python ../scripts/seed_demo.py

      - name: Smoke tests
        env:
          BASE_URL: http://localhost:8000
          SMOKE_USERNAME: demo-operator
          SMOKE_PASSWORD: demo-operator-password
        run: bash scripts/smoke.sh

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=200

      - name: Stop stack (volumes preserved)
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down
