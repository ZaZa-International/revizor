name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: mgts
          POSTGRES_PASSWORD: mgts
          POSTGRES_DB: mgts_infra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mgts -d mgts_infra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      s3:
        image: localstack/localstack:latest
        env:
          SERVICES: s3
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      DATABASE_URL: postgresql+asyncpg://mgts:mgts@localhost:5432/mgts_infra
      REDIS_URL: redis://localhost:6379/0
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /tmp/mgts-storage
      S3_ENDPOINT_URL: http://localhost:4566
      APP_ENV: test
      ML_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Unit tests
        run: uv run pytest -m unit

      - name: Integration / API / contract tests
        run: >-
          uv run pytest -m "integration or api or contract"
          --cov=app --cov-report=term-missing --cov-report=xml

      - name: Migration roundtrip (downgrade base + upgrade head)
        run: uv run alembic downgrade base && uv run alembic upgrade head

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t mgts-infra-backend:ci backend/
