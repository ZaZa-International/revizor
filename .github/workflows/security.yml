name: security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # Строгий режим (DOC-5): любая известная уязвимость в зависимостях роняет job.
      # Аудируем экспорт lock-файла БЕЗ самого проекта: mgts-infra-backend нет на
      # PyPI, и `pip-audit --strict` по окружению падает на editable-инсталляции
      # проекта (dependency collection failure), а не на уязвимостях.
      - name: Audit dependencies
        run: |
          uv export --frozen --no-emit-project --no-hashes -o /tmp/audit-requirements.txt
          uv run pip-audit --strict -r /tmp/audit-requirements.txt
